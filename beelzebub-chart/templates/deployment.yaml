{{- if and .Values.eventSpool.enabled (or .Values.autoscaling.enabled (ne (int .Values.replicaCount) 1)) }}
{{- fail "eventSpool requires replicaCount=1 and autoscaling.enabled=false; each sensor must own a separate spool" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beelzebub-chart.fullname" . }}
  labels:
    {{- include "beelzebub-chart.labels" . | nindent 4 }}
spec:
  {{- if .Values.eventSpool.enabled }}
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "beelzebub-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "beelzebub-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "beelzebub-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if .Values.eventSpool.enabled }}
          env:
            - name: BEELZEBUB_EVENT_SPOOL_DIR
              value: {{ .Values.eventSpool.mountPath | quote }}
            - name: BEELZEBUB_EVENT_SPOOL_MAX_BYTES
              value: {{ .Values.eventSpool.maxBytes | quote }}
            - name: BEELZEBUB_EVENT_SPOOL_MAX_RECORDS
              value: {{ .Values.eventSpool.maxRecords | quote }}
          {{- end }}
          volumeMounts:
            - name: config-core-volume
              mountPath: /configurations/beelzebub.yaml
              subPath: beelzebub.yaml
              readOnly: true
            - name: config-services-volume
              mountPath: /configurations/services/service.yaml
              subPath: service.yaml
              readOnly: true
            {{- if .Values.eventSpool.enabled }}
            - name: event-spool
              mountPath: {{ .Values.eventSpool.mountPath | quote }}
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.eventSpool.enabled }}
        - name: event-spool
          persistentVolumeClaim:
            claimName: {{ .Values.eventSpool.persistence.existingClaim | default (printf "%s-events" (include "beelzebub-chart.fullname" .)) | quote }}
        {{- end }}
        - name: config-core-volume
          configMap:
            name: beelzebub-configuration
        - name: config-services-volume
          configMap:
            name: beelzebub-services
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
