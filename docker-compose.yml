services:
  beelzebub:
    build:
      context: .
      args:
        # Token for cloning private plugins during the image build (from .env).
        BEELZEBUB_GITHUB_TOKEN: ${BEELZEBUB_GITHUB_TOKEN:-}
    container_name: beelzebub
    restart: always
    ports:
      - "22:22"
      - "23:23"
      - "2222:2222"
      - "8080:8080"
      - "8081:8081"
      - "8082:80" # HTTP honeypot — 80 lasciata libera per Caddy reverse proxy
      - "3306:3306"
      - "2112:2112" #Prometheus Open Metrics
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URI: ${RABBITMQ_URI:-}
      OPEN_AI_SECRET_KEY: ${OPEN_AI_SECRET_KEY:-}
      # Beelzebub Cloud (from .env, written by install.sh)
      BEELZEBUB_CLOUD_ENABLED: ${BEELZEBUB_CLOUD_ENABLED:-false}
      BEELZEBUB_CLOUD_URI: ${BEELZEBUB_CLOUD_URI:-}
      BEELZEBUB_CLOUD_AUTH_TOKEN: ${BEELZEBUB_CLOUD_AUTH_TOKEN:-}
    volumes:
      - "./configurations:/configurations"
      - "./state:/state"
