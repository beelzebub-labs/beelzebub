apiVersion: "v1"
protocol: "tcp"
address: ":5900"
description: "VNC Server (RFB Protocol) with VNC Authentication credential capture"
wireEncoding: "latin1"
banner: "RFB 003.008"
framing:
  mode: "fixed"
  fixedSize: 12
wirePlugins:
  - "vnc"
commands:
  - regex: "^RFB 003\\.008\\n$"
    handler: "\x01\x02"
    name: "vnc_security_types"
    nextFraming:
      mode: "fixed"
      fixedSize: 1
  - regex: "(?s)^.{16}$"
    handler: "\x00\x00\x00\x01\x00\x00\x00\x15Authentication failed"
    name: "vnc_auth_response"
    closeAfter: true
  - regex: "(?s)^\\x02$"
    handler: "\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"
    name: "vnc_challenge"
    patches:
      - type: "random"
        offset: 0
        length: 16
    nextFraming:
      mode: "fixed"
      fixedSize: 16
deadlineTimeoutSeconds: 30
serverName: "VNC-LAB-01"
